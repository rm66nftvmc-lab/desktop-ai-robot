; Standalone diagnostic. Does not change the production Arduino SDK or NVS.
[platformio]
default_envs = low-power

[env:low-power]
; IDF 4 toolchain matches production; newer platform defaults target IDF 5.
platform = espressif32@5.4.0
platform_packages = platformio/framework-espidf@3.40407.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = ../../partitions.csv
board_build.sdkconfig = sdkconfig.low-power
monitor_speed = 115200
